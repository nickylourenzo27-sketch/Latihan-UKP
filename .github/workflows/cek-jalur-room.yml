# Pemeriksa jalur Room tim.
# Menjalankan js/ruang.js yang sama dengan website terhadap jalur publik sungguhan (Node 22, tanpa dependensi).
# Tidak ada data pengguna yang dikirim: room uji sekali pakai, terenkripsi, dan ditutup di akhir.
# Berjalan saat js/ruang.js atau pemeriksanya berubah, atau dijalankan manual dari tab Actions.
name: Cek jalur Room tim
on:
  workflow_dispatch:
  push:
    branches: [main, cek-jalur]
    paths:
      - 'js/ruang.js'
      - 'tools/cek-relai.js'
      - '.github/workflows/cek-jalur-room.yml'
permissions:
  contents: read
concurrency:
  group: cek-jalur-room-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cek:
    name: Uji jalur publik
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uji jalur dengan js/ruang.js
        run: node tools/cek-relai.js --json
