# Pemeriksa Room tim.
# 1) Jalur: menjalankan js/ruang.js yang sama dengan website terhadap jalur publik sungguhan (Node 22, tanpa dependensi).
# 2) Peramban: alur pemimpin dan dua anggota dari layar ke layar di Chrome, lewat jalur publik yang sama.
# 3) WebKit (v9.4): alur yang sama di WebKit dari Playwright (mesin Safari), HP anggota memakai profil iPhone.
# Tidak ada data pengguna yang dikirim: room uji sekali pakai, terenkripsi, dan ditutup di akhir.
# Berjalan saat berkas room atau pemeriksanya berubah, atau dijalankan manual dari tab Actions.
name: Cek jalur Room tim
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'js/ruang.js'
      - 'js/views-ruang.js'
      - 'js/app.js'
      - 'sw.js'
      - 'tools/cek-relai.js'
      - 'tools/uji-room-web.js'
      - '.github/workflows/cek-jalur-room.yml'
permissions:
  contents: read
concurrency:
  group: cek-jalur-room-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cek:
    name: Uji jalur publik
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uji jalur dengan js/ruang.js
        run: node tools/cek-relai.js --json
  peramban:
    name: Uji peramban lewat jalur publik
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang playwright-core
        run: npm install --no-save --no-audit --no-fund playwright-core@1
      - name: Alur pemimpin dan anggota di Chrome
        run: node tools/uji-room-web.js .
  webkit:
    name: Uji peramban WebKit (profil iPhone)
    # Image resmi Playwright sudah memuat WebKit beserta pustaka sistemnya, jadi mesin uji tidak memasang paket Ubuntu.
    # Latar: pada 11 November 2026 `npx playwright install --with-deps webkit` macet sampai batas waktu, baik di ubuntu-26.04
    # maupun ubuntu-24.04, karena alamat mirror paket Ubuntu tidak ditemukan dari mesin uji ("Temporary failure resolving").
    # Versi image dan versi paket npm playwright HARUS sama; naikkan keduanya bersama-sama.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Pasang Playwright (versi sama dengan image)
        run: npm install --no-save --no-audit --no-fund playwright@1.65.0
      - name: Alur pemimpin dan anggota di WebKit
        env:
          BROWSER: webkit
          HOME: /root
        run: node tools/uji-room-web.js .
