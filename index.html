<script>
/* Penjaga muat (boot guard): menulis progres modul di layar "Memuat materi…", menangkap berkas/skrip yang gagal dimuat, dan — bila
   aplikasi belum siap (koneksi lambat, berkas gagal diunduh, cache lama) — menampilkan panel pemulihan: muat ulang, bersihkan cache,
   salin laporan. Progres belajar (localStorage) tidak pernah disentuh. js/app.js memanggil window.__ukpMuat.siap() setelah render pertama. */
(function () {
  var W = window, D = document, TOTAL = 30, mulai = Date.now(), terakhirNaik = mulai, nTerakhir = 0, galat = [], siap = false, panel = false, detak;
  function skrip() { try { return performance.getEntriesByType('resource').filter(function (r) { return r.initiatorType === 'script'; }).length; } catch (e) { return 0; } }
  function nama(u) { return String(u || '').replace(/[?#].*$/, '').split('/').slice(-2).join('/'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function catat(p) { if (galat.length < 12 && galat.indexOf(p) < 0) galat.push(p); }
  W.addEventListener('error', function (e) {
    if (siap) return;
    var t = e && e.target;
    if (t && t !== W && t.tagName && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) { catat('Berkas gagal dimuat: ' + nama(t.src || t.href)); if (t.tagName === 'SCRIPT') tampil(); }
    else if (e && e.message) catat('Galat skrip: ' + e.message + (e.filename ? ' @ ' + nama(e.filename) + ':' + e.lineno : ''));
  }, true);
  W.addEventListener('unhandledrejection', function (e) { if (!siap) { var r = e && e.reason; catat('Galat: ' + (r && r.message ? r.message : r)); } });
  function laporan() {
    var sw = '?'; try { sw = navigator.serviceWorker && navigator.serviceWorker.controller ? 'aktif' : 'tidak ada'; } catch (e) {}
    return ['MABAR UKP — laporan muat halaman', 'Waktu sejak mulai: ' + Math.round((Date.now() - mulai) / 1000) + ' detik', 'Modul termuat: ' + skrip() + '/' + TOTAL,
      'Alamat: ' + location.href.replace(/[?#].*$/, ''), 'Peramban: ' + navigator.userAgent, 'Online: ' + navigator.onLine, 'Service worker: ' + sw,
      'Inti aplikasi (UKP): ' + (W.UKP ? 'termuat' : 'belum'), 'Layar: ' + W.innerWidth + '×' + W.innerHeight]
      .concat(galat.length ? ['Galat:'].concat(galat.map(function (g) { return '- ' + g; })) : ['Galat: tidak ada']).join('\n');
  }
  function bersihkan() {
    var tugas = [];
    try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) tugas.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
    try { if (W.caches && caches.keys) tugas.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    Promise.all(tugas).catch(function () {}).then(function () { location.reload(); });
  }
  function tombol(aksi, label, utama) {
    return '<button type="button" data-aksi="' + aksi + '" style="min-height:44px;padding:0 16px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer;' +
      (utama ? 'border:0;background:#0F2A4A;color:#fff' : 'border:1px solid currentColor;background:transparent;color:inherit') + '">' + label + '</button>';
  }
  function tampil() {
    if (panel || siap) return; panel = true;
    var main = D.getElementById('main'); if (!main) return;
    var dtk = Math.round((Date.now() - mulai) / 1000), gagal = galat.length;
    main.innerHTML = '<div id="ukp-pemulihan" style="max-width:36rem;margin:10vh auto;padding:0 20px;font:16px/1.55 system-ui,-apple-system,\'Segoe UI\',sans-serif">' +
      '<p style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin:0 0 6px">MABAR UKP</p>' +
      '<h1 style="font-size:1.35rem;line-height:1.3;margin:0 0 8px">' + (gagal ? 'Ada berkas yang gagal dimuat' : 'Halaman belum siap setelah ' + dtk + ' detik') + '</h1>' +
      '<p style="margin:0 0 14px">' + (gagal ? 'Sebagian materi tidak terunduh. ' : 'Biasanya karena koneksi lambat atau cache lama di peramban. ') +
      'Coba muat ulang; bila masih gagal, bersihkan cache. Progres belajar di perangkat ini tidak terhapus.</p>' +
      (gagal ? '<ul style="margin:0 0 14px;padding-left:20px;font-size:14px">' + galat.map(function (g) { return '<li>' + esc(g) + '</li>'; }).join('') + '</ul>' : '') +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' + tombol('ulang', 'Muat ulang', true) + tombol('bersih', 'Bersihkan cache &amp; muat ulang') + tombol('salin', 'Salin laporan') + '</div>' +
      '<p style="font-size:13px;opacity:.75;margin:14px 0 0">Masih gagal? Kirimkan laporan di atas. Versi offline (berkas tunggal, Pengaturan › Versi offline) bisa dibuka tanpa internet.</p>' +
      '<pre id="ukp-laporan" style="white-space:pre-wrap;font-size:12px;opacity:.8;margin:10px 0 0" hidden></pre></div>';
    main.addEventListener('click', function (e) {
      var b = e.target && e.target.closest ? e.target.closest('button[data-aksi]') : null; if (!b) return;
      var a = b.getAttribute('data-aksi');
      if (a === 'ulang') location.reload();
      else if (a === 'bersih') bersihkan();
      else if (a === 'salin') { var t = laporan(), pre = D.getElementById('ukp-laporan'); if (pre) { pre.textContent = t; pre.hidden = false; } try { navigator.clipboard.writeText(t).then(function () { b.textContent = 'Tersalin'; }, function () {}); } catch (x) {} }
    });
  }
  W.__ukpMuat = { siap: function () { siap = true; clearInterval(detak); }, galat: function () { return galat.slice(); }, laporan: laporan, tampil: tampil };
  detak = setInterval(function () {
    if (siap) return;
    if (!D.querySelector('#main .muat') && !D.getElementById('ukp-pemulihan')) { W.__ukpMuat.siap(); return; }
    var n = Math.min(skrip(), TOTAL), kini = Date.now();
    if (n !== nTerakhir) { nTerakhir = n; terakhirNaik = kini; }
    var el = D.querySelector('#main .muat .eyebrow'); if (el && n > 0 && !W.UKP_OFFLINE) el.textContent = 'Memuat materi… ' + n + '/' + TOTAL + ' modul';
    // macet: tidak ada modul baru selama 20 detik (dan sudah ≥ 25 detik sejak mulai) → panel pemulihan; render aplikasi menggantikannya bila akhirnya siap
    if (kini - mulai > 25000 && kini - terakhirNaik > 20000) tampil();
  }, 500);
})();
